[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hf-dataset-catalog"
version = "0.1.0"
description = "Resumable metadata catalog for high-value Hugging Face datasets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "zoiiiiie" }]
dependencies = [
  "duckdb>=1.2,<2",
  "httpx>=0.28,<1",
  "huggingface-hub>=1.1,<2",
  "pyarrow>=18,<24",
  "pydantic>=2.10,<3",
  "python-dateutil>=2.9,<3",
  "pytz>=2025.2",
  "pyyaml>=6.0,<7",
  "rapidfuzz>=3.10,<4",
  "tenacity>=9,<10",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
  "types-python-dateutil>=2.9,<3",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
hf-catalog = "hf_dataset_catalog.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hf_dataset_catalog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: accesses live external APIs"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["hf_dataset_catalog"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
